plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // JEI: nur die API zum Kompilieren, damit sich die DTP-Oberflächen ausblenden lassen.
    maven {
        url = "https://maven.blamejared.com/"
        content { includeGroup "mezz.jei" }
    }
    // Optionale Mods ohne eigenes API-Artefakt (Sophisticated Backpacks/Core, Better Advancements): über Modrinths Maven.
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    // Minecraft-Version im Dateinamen (dtp-26.3-5.0.0.jar), damit beim Download klar ist, wofür die Jar gedacht ist.
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Sophisticated Backpacks: nur zum Kompilieren von dev.dtp.compat.sophisticated, nie in der JAR, nie Pflicht.
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"

    // Optionale Mods im Dev-Client/-Server mitladen: ./gradlew runClient -Pwith_compat=true
    // Ohne den Schalter läuft alles ohne sie — so wird geprüft, dass DTP keine Abhängigkeit hat.
    if (providers.gradleProperty("with_compat").getOrElse("false") == "true") {
        localRuntime "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
        localRuntime "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
        localRuntime "maven.modrinth:better-advancements:${better_advancements_version}"
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Schnellprüfung der Angelschatz-Fundliste ohne Spielstart. Eine kaputte Loot-Table lässt in 26.3 den ganzen Server
// beim Laden der Registries abbrechen — dann laufen auch die GameTests nicht. Deshalb hängt die Prüfung an
// processResources und schlägt bei build, runClient, runGameTestServer und deploy-prism.sh vorher an.
// Was sich nur im Spiel prüfen lässt (Item existiert, Verzauberung greift, Modifier-Rate), prüfen die GameTests
// fishing_finds_syntax, fishing_finds_entries, fishing_treasure und double_bobbers.
var validateFishingFinds = tasks.register("validateFishingFinds") {
    group = "verification"
    description = "Prüft data/dtp/loot_table/gameplay/fishing/structure_finds.json auf Syntax und Aufbau."
    // -PfishingFinds=<pfad> prüft eine andere Datei, z. B. die Fundliste eines Datapacks.
    var file = project.hasProperty("fishingFinds") ? file(project.property("fishingFinds"))
            : layout.projectDirectory.file("src/main/resources/data/dtp/loot_table/gameplay/fishing/structure_finds.json").asFile
    var marker = layout.buildDirectory.file("validateFishingFinds/ok").get().asFile
    inputs.file(file)
    outputs.file(marker)
    doLast {
        var id = ~/^([a-z0-9_.-]+:)?[a-z0-9_.\/-]+$/
        var errors = []
        def json
        try {
            json = new groovy.json.JsonSlurper().parse(file, 'UTF-8')
        } catch (Exception e) {
            throw new GradleException("structure_finds.json ist kein gültiges JSON: ${e.message}")
        }
        if (!(json instanceof Map) || !(json.pools instanceof List) || json.pools.isEmpty()) {
            throw new GradleException("structure_finds.json: \"pools\" fehlt oder ist leer")
        }
        json.pools.eachWithIndex { pool, p ->
            if (!(pool instanceof Map) || !pool.containsKey('rolls')) {
                errors << "Pool ${p}: \"rolls\" fehlt"
            }
            if (pool instanceof Map && pool.containsKey('functions')) {
                errors << "Pool ${p}: \"functions\" heißt seit 26.3 \"modifier\""
            }
            if (pool instanceof Map && pool.containsKey('conditions')) {
                errors << "Pool ${p}: \"conditions\" heißt seit 26.3 \"condition\""
            }
            if (!(pool instanceof Map) || !(pool.entries instanceof List) || pool.entries.isEmpty()) {
                errors << "Pool ${p}: \"entries\" fehlt oder ist leer"
                return
            }
            pool.entries.eachWithIndex { entry, i ->
                var where = "Pool ${p}, Eintrag ${i} (${entry instanceof Map ? (entry.name ?: entry.type) : entry})"
                if (!(entry instanceof Map)) {
                    errors << "${where}: kein Objekt"
                    return
                }
                if (!(entry.type instanceof String) || !(entry.type ==~ id)) {
                    errors << "${where}: \"type\" fehlt oder ist keine gültige ID"
                }
                if (entry.type in ['minecraft:item', 'minecraft:tag'] && !(entry.name instanceof String && entry.name ==~ id)) {
                    errors << "${where}: \"name\" ist keine gültige ID — genau ein Namensraum, z. B. minecraft:book"
                }
                if (entry.containsKey('weight') && !(entry.weight instanceof Integer && entry.weight >= 1)) {
                    errors << "${where}: \"weight\" muss eine ganze Zahl ≥ 1 sein, ist ${entry.weight}"
                }
                // Feldnamen von vor 26.3 lädt Minecraft ohne Fehler, ignoriert sie aber still.
                if (entry.containsKey('functions')) {
                    errors << "${where}: \"functions\" heißt seit 26.3 \"modifier\" (wird sonst still ignoriert)"
                }
                if (entry.containsKey('conditions')) {
                    errors << "${where}: \"conditions\" heißt seit 26.3 \"condition\" (wird sonst still ignoriert)"
                }
                if (entry.containsKey('modifier')) {
                    var modifiers = entry.modifier instanceof List ? entry.modifier : [entry.modifier]
                    modifiers.eachWithIndex { fn, f ->
                        if (fn instanceof Map && fn.containsKey('function')) {
                            errors << "${where}, Modifier ${f}: \"function\" heißt seit 26.3 \"type\""
                            return
                        }
                        if (!(fn instanceof Map) || !(fn.type instanceof String) || !(fn.type ==~ id)) {
                            errors << "${where}, Modifier ${f}: \"type\" fehlt oder ist keine gültige ID"
                            return
                        }
                        var options = fn.options
                        if (options != null) {
                            var list = options instanceof List ? options : [options]
                            list.each { o ->
                                if (!(o instanceof String) || !((o.startsWith('#') ? o.substring(1) : o) ==~ id)) {
                                    errors << "${where}, Modifier ${f}: ungültiger Eintrag in \"options\": ${o}"
                                }
                            }
                        }
                        if (fn.type in ['minecraft:enchant_with_levels', 'enchant_with_levels'] && !fn.containsKey('levels')) {
                            errors << "${where}, Modifier ${f}: enchant_with_levels braucht \"levels\""
                        }
                    }
                }
            }
        }
        if (!errors.isEmpty()) {
            throw new GradleException("Fehler in structure_finds.json:\n  " + errors.join("\n  "))
        }
        marker.parentFile.mkdirs()
        marker.text = "ok"
    }
}
tasks.named("processResources") { dependsOn validateFishingFinds }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
